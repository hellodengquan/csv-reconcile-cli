[project]
name = "csv-reconcile"
version = "0.1.0"
description = "CSV 对账命令行工具：关键字段匹配、差异定位、缺失行报告"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
]

[project.scripts]
csv-reconcile = "csv_reconcile.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csv_reconcile*"]
